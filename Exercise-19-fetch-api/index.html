<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Fetch Api</title>
        <link href="src/output.css" rel="stylesheet" />
        <script src="login.js" defer></script>
    </head>
    <body class="bg-amber-50">
        <main class="h-dvh flex justify-center items-center w-auto">
            <div
                class="bg-amber-50 flex flex-col m-auto p-12 gap-5 h-auto w-3xl"
            >
                <h1 class="text-center text-4xl font-bold text-amber-600">
                    Login
                </h1>
                <label for="Username" class="text-2xl">Username</label>
                <input
                    type="text"
                    placeholder="Username"
                    class="border rounded-md w-full h-3 p-6"
                    id="username"
                />
                <label for="Password" class="text-2xl">Password</label>
                <input
                    type="text"
                    placeholder="Password"
                    class="border rounded-md w-full h-3 p-6"
                    id="password"
                />
                <button
                    class="cursor-pointer text-2xl w-full p-3 bg-amber-600 rounded-md text-amber-50 font-semibold"
                    id="submit"
                >
                    Login
                </button>
                <div id="item"></div>
            </div>
        </main>
    </body>
</html>
